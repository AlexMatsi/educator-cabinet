name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Перевірка Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Перевірити залежності, код, тести та web-збірку
        run: bash tool/check.sh

      - name: Підготувати виправлення форматування
        if: failure()
        run: |
          dart format lib test
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', 'lib', 'test'],
              text=True,
          ).splitlines()
          for path in paths:
              print('REPAIR_FILE_JSON=' + json.dumps({
                  'path': path,
                  'content': pathlib.Path(path).read_text(),
              }))
          PY
